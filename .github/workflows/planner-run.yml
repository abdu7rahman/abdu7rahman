name: Planner run

# Regenerates assets/run.svg by actually executing the planners from
# reactive_autonomous_nav on a freshly seeded map. The README cannot host an
# interactive demo -- GitHub strips script and iframe -- so this is the next
# best thing: a real search, replayed, on a different map every day.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/gen_run.py
      - .github/workflows/planner-run.yml

concurrency:
  group: planner-run
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet numpy

      - name: Check the palette still holds
        run: python3 tools/check_palette.py

      - name: Run the planners and render the replay
        run: |
          SEED=$RANDOM
          python3 tools/gen_run.py "$SEED"
          PLATE_THEME=night python3 tools/gen_run.py "$SEED"

      - name: Commit if it changed
        run: |
          if [[ -n "$(git status --porcelain assets/run.svg assets/run-night.svg)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/run.svg assets/run-night.svg
            git commit -m "chore(assets): refresh the planner run"
            git push
          else
            echo "no change"
          fi
