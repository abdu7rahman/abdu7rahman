<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" fill="none" role="img" aria-label="Mohammed Abdul Rahman — robotics engineer. Motion planning, manipulation, and the bringup that makes them run.">
<title>Mohammed Abdul Rahman — Robotics engineer</title>
<desc>Mohammed Abdul Rahman — robotics engineer. Motion planning, manipulation, and the bringup that makes them run.</desc>
<defs><style>
  text { font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif }
  .mono { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace }
  @media (prefers-reduced-motion: no-preference) {
    /* Authored settled; this moves away from settled and back, so switching
       the block off leaves the plate correct rather than stuck at frame zero. */
    .in { animation: rise 560ms cubic-bezier(0.22, 1, 0.36, 1) both }
    .d1 { animation-delay: 40ms } .d2 { animation-delay: 100ms }
    .d3 { animation-delay: 170ms }
    @keyframes rise { from { opacity: 0; transform: translateY(7px) } }
  }
</style></defs>
<rect width="1000" height="390" fill="#0d1117"/>
<text class="in d1 mono" x="72" y="100" font-size="12" font-weight="500" letter-spacing="1" fill="#9198a1">ROBOTICS ENGINEER</text>
<text class="in d2" x="72" y="192" font-size="88" font-weight="600" letter-spacing="-2.6" fill="#f0f6fc">Mohammed</text>
<text class="in d2" x="72" y="276" font-size="88" font-weight="600" letter-spacing="-2.6" fill="#f0f6fc">Abdul Rahman</text>
<text class="in d3" x="72" y="330" font-size="17" font-weight="400" letter-spacing="-0.1" fill="#9198a1">Motion planning, manipulation, and the bringup that makes them run.</text>
</svg>