<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" fill="none" role="img" aria-label="Mohammed Abdul Rahman — robotics engineer. Motion planning, manipulation and hardware bringup. Advanced Robotics and AI intern at Siemens; MS Robotics at Northeastern University, class of 2027; based in Berkeley, California. Works in ROS 2, MoveIt 2, Isaac Sim and physical AI.">
<title>Mohammed Abdul Rahman — Robotics engineer</title>
<desc>Mohammed Abdul Rahman — robotics engineer. Motion planning, manipulation and hardware bringup. Advanced Robotics and AI intern at Siemens; MS Robotics at Northeastern University, class of 2027; based in Berkeley, California. Works in ROS 2, MoveIt 2, Isaac Sim and physical AI.</desc>
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="0.35" y2="1">
  <stop offset="0" stop-color="#1e1815"/>
  <stop offset="1" stop-color="#14100e"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#4a3931" stop-opacity="0"/>
  <stop offset="0.28" stop-color="#4a3931" stop-opacity="0.9"/>
  <stop offset="0.75" stop-color="#4a3931" stop-opacity="0.35"/>
  <stop offset="1" stop-color="#4a3931" stop-opacity="0"/>
</linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ef6547"/>
  <stop offset="1" stop-color="#ef6547" stop-opacity="0.25"/>
</linearGradient>
<filter id="lift" x="-12%" y="-30%" width="124%" height="180%">
  <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000"
                flood-opacity="0.5"/>
</filter>
<pattern id="paper" width="48" height="48" patternUnits="userSpaceOnUse">
  <path d="M48 0H0V48" stroke="#291f1a" stroke-width="1"/>
</pattern>
<clipPath id="plateclip"><rect x="16" y="10" width="968" height="268" rx="16"/></clipPath>
<style>
  text { font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif }
  .mono { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace }
  @media (prefers-reduced-motion: no-preference) {
    /* Authored settled, animated away from settled and back, so switching this
       block off leaves the plate correct rather than stuck at frame zero. */
    .in { animation: rise 620ms cubic-bezier(0.22, 1, 0.36, 1) both }
    .d1 { animation-delay: 60ms }  .d2 { animation-delay: 120ms }
    .d3 { animation-delay: 180ms } .d4 { animation-delay: 240ms }
    .d5 { animation-delay: 300ms }
    .wipe { animation: wipe 900ms cubic-bezier(0.22, 1, 0.36, 1) both; animation-delay: 140ms }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) } }
    @keyframes wipe { from { transform: scaleX(0) } }
  }
</style>
</defs>
<rect x="16" y="10" width="968" height="268" rx="16" fill="url(#plate)" filter="url(#lift)"/>
<g clip-path="url(#plateclip)"><rect x="16" y="10" width="968" height="268" fill="url(#paper)" opacity="0.75"/></g>
<rect x="16.5" y="10.5" width="967" height="267" rx="15.5" stroke="#392b24"/>
<path d="M40 11H960" stroke="url(#edge)" stroke-width="1.2"/>
<text class="in d1 mono" x="64" y="68" font-size="11" font-weight="500" letter-spacing="0.9" fill="#ef6547">ROBOTICS ENGINEER</text>
<text class="in d2" x="64" y="120" font-size="46" font-weight="700" letter-spacing="-1.2" fill="#f4ece2">Mohammed</text>
<text class="in d2" x="64" y="166" font-size="46" font-weight="700" letter-spacing="-1.2" fill="#f4ece2">Abdul Rahman</text>
<rect class="wipe" x="64" y="184" width="300" height="3" rx="1.5" fill="url(#rule)" style="transform-origin:64px 185px"/>
<text class="in d3" x="64" y="222" font-size="14.5" font-weight="400" letter-spacing="-0.1" fill="#a3968a">Motion planning, manipulation, and the bringup that makes them run.</text>
<g class="in d4"><rect x="64" y="244" width="64" height="27" rx="8" fill="#191311" stroke="#392b24"/><text class="mono" x="96" y="261.5" font-size="11" font-weight="500" letter-spacing="0.35" fill="#a3968a" text-anchor="middle">ROS 2</text></g>
<g class="in d4"><rect x="136" y="244" width="87" height="27" rx="8" fill="#191311" stroke="#392b24"/><text class="mono" x="179" y="261.5" font-size="11" font-weight="500" letter-spacing="0.35" fill="#a3968a" text-anchor="middle">MoveIt 2</text></g>
<g class="in d4"><rect x="231" y="244" width="94" height="27" rx="8" fill="#191311" stroke="#392b24"/><text class="mono" x="278" y="261.5" font-size="11" font-weight="500" letter-spacing="0.35" fill="#a3968a" text-anchor="middle">Isaac Sim</text></g>
<g class="in d4"><rect x="333" y="244" width="110" height="27" rx="8" fill="#191311" stroke="#392b24"/><text class="mono" x="388" y="261.5" font-size="11" font-weight="500" letter-spacing="0.35" fill="#a3968a" text-anchor="middle">Physical AI</text></g>
<path d="M606 58V252" stroke="#392b24"/>
<g class="in d3"><text class="mono" x="646" y="74" font-size="9.5" font-weight="500" letter-spacing="0.5" fill="#a3968a">NOW</text><text x="646" y="97" font-size="13.5" font-weight="500" letter-spacing="-0.1" fill="#f4ece2">Advanced Robotics and AI intern, Siemens</text></g>
<g class="in d4"><text class="mono" x="646" y="132" font-size="9.5" font-weight="500" letter-spacing="0.5" fill="#a3968a">STUDY</text><text x="646" y="155" font-size="13.5" font-weight="500" letter-spacing="-0.1" fill="#f4ece2">MS Robotics, Northeastern ’27</text></g>
<g class="in d5"><text class="mono" x="646" y="190" font-size="9.5" font-weight="500" letter-spacing="0.5" fill="#a3968a">BASED</text><text x="646" y="213" font-size="13.5" font-weight="500" letter-spacing="-0.1" fill="#f4ece2">Berkeley, California</text></g>
<text class="in d5 mono" x="646" y="262" font-size="10.5" font-weight="400" letter-spacing="0.4" fill="#a3968a" opacity="0.8">building robots that may work</text>
</svg>