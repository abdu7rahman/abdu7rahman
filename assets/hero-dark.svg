<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" fill="none" role="img" aria-label="Mohammed Abdul Rahman — robotics engineer. Motion planning, manipulation and hardware bringup. Advanced Robotics and AI intern at Siemens; MS Robotics at Northeastern University, class of 2027; based in Berkeley, California.">
<title>Mohammed Abdul Rahman — Robotics engineer</title>
<desc>Mohammed Abdul Rahman — robotics engineer. Motion planning, manipulation and hardware bringup. Advanced Robotics and AI intern at Siemens; MS Robotics at Northeastern University, class of 2027; based in Berkeley, California.</desc>
<defs><style>
  text { font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill:#f0f6fc }
  .mono { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace }
  .mut { fill:#9198a1 }
  @media (prefers-reduced-motion: no-preference) {
    /* Authored settled; this moves away from settled and back, so switching
       the block off leaves the plate correct rather than stuck at frame zero. */
    .in { animation: rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both }
    .d1 { animation-delay: 40ms }  .d2 { animation-delay: 90ms }
    .d3 { animation-delay: 140ms } .d4 { animation-delay: 190ms }
    @keyframes rise { from { opacity: 0; transform: translateY(6px) } }
  }
</style></defs>
<rect x="0.5" y="0.5" width="999" height="259" rx="6" fill="#0d1117" stroke="#3d444d"/>
<text class="in d1 mono mut" x="56" y="60" font-size="11.5" font-weight="500" letter-spacing="0.4">ROBOTICS ENGINEER</text>
<text class="in d2" x="56" y="118" font-size="44" font-weight="600" letter-spacing="-1.1">Mohammed Abdul Rahman</text>
<text class="in d3 mut" x="56" y="156" font-size="15" letter-spacing="-0.1">Motion planning, manipulation, and the bringup that makes them run.</text>
<path class="in d4" d="M56 190H944" stroke="#3d444d"/>
<g class="in d4"><text class="mono mut" x="56" y="216" font-size="10" font-weight="500" letter-spacing="0.5">NOW</text><text x="56" y="238" font-size="13" font-weight="500" letter-spacing="-0.05">Advanced Robotics and AI intern, Siemens</text></g>
<g class="in d4"><text class="mono mut" x="356" y="216" font-size="10" font-weight="500" letter-spacing="0.5">STUDY</text><text x="356" y="238" font-size="13" font-weight="500" letter-spacing="-0.05">MS Robotics, Northeastern ’27</text></g>
<g class="in d4"><text class="mono mut" x="656" y="216" font-size="10" font-weight="500" letter-spacing="0.5">BASED</text><text x="656" y="238" font-size="13" font-weight="500" letter-spacing="-0.05">Berkeley, California</text></g>
