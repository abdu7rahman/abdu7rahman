<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" fill="none" role="img" aria-label="Two charts. Left: monthly commit cadence, 240 commits authored across 61 months from 2021-07 to 2026-07, 20 active months, median 8, peak 49. Right: source-byte mix across 27 repositories - Python 30.7 percent, CMake 18.1 percent, YAML 15.0 percent, XML/URDF 14.8 percent, C++ 8.5 percent, Other 12.9 percent.">
<title>Counted, not claimed</title>
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="0.3" y2="1">
  <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#faf6f0"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.75"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<filter id="lift" x="-8%" y="-20%" width="116%" height="150%">
  <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2a201a"
                flood-opacity="0.08"/>
</filter>
<style>
  text { font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif }
  .mono { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace }
  .head { font-size:15px; font-weight:600; letter-spacing:-0.1px }
  .sub  { font-size:11px; font-weight:400; letter-spacing:0px }
  .ax   { font-size:10.5px; font-weight:500; letter-spacing:0.2px }
  .lg   { font-size:11.5px; font-weight:450; letter-spacing:0px }
  @media (prefers-reduced-motion: no-preference) {
    /* Authored settled. These grow from nothing only when motion is welcome;
       with it off the charts are already the right size. */
    .bar { animation: grow 620ms cubic-bezier(0.22, 1, 0.36, 1) both; transform-origin: center bottom }
    .seg { animation: wide 700ms cubic-bezier(0.22, 1, 0.36, 1) both }
    @keyframes grow { from { transform: scaleY(0) } }
    @keyframes wide { from { transform: scaleX(0) } }
  }
</style>
